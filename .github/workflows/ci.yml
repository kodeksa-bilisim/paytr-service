# Ödeme servisi CI: her push/PR'da test + bağımlılık açığı denetimi; her sabah yalnız denetim.
# Kabul edilmiş açıklar .cargo/audit.toml'da (gerekçe: qurlbackend docs/guvenlik/tarama-2026-11-17.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * *" # 07:00 TR: gece çıkan yeni açıklar
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  SQLX_OFFLINE: "true"

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --locked

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
