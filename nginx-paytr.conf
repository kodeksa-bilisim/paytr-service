# Bu bloğu mevcut api.nlink.tr server { ... } içine ekle
# Genellikle /etc/nginx/sites-available/api.nlink.tr veya
# /etc/nginx/conf.d/api.nlink.tr.conf dosyasındadır
#
# SADECE callback endpoint'i dışarıya açılır.
# /api/v1/payments/init, /api/v1/cards/* ve diğerleri
# yalnızca localhost üzerinden erişilebilir olmalıdır.

location = /paytr/api/v1/payments/callback {
    proxy_pass         http://127.0.0.1:3001/api/v1/payments/callback;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# Diğer paytr endpoint'leri dışarıya KAPALI
location /paytr/ {
    return 404;
}
